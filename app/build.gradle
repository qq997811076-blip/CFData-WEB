plugins {
    id "com.android.application"
}

android {
    namespace "com.cfdata.web"
    compileSdk 35


    defaultConfig {
        applicationId "com.cfdata.web"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName System.getenv("ANDROID_VERSION_NAME") ?: "1.0"
    }

    buildTypes {
        debug {
            signingConfig null
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}
