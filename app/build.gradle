plugins {
    id "com.android.application"
}

android {
    namespace "com.cfdata.web"
    compileSdk 35

    defaultConfig {
        applicationId "com.cfdata.web"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName System.getenv("ANDROID_VERSION_NAME") ?: "1.0"
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ["src/main/jniLibs"]
        }
    }

    buildTypes {
        debug {
        }
        unsigned {
            // Inherit from release, not debug: AGP automatically signs debug variants.
            initWith release
            signingConfig null
            matchingFallbacks = ["release", "debug"]
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}
