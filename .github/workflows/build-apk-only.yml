name: Build Android APK Only

on:
  workflow_dispatch:
    inputs:
      version:
        description: "APK version name"
        required: false
        default: "v1.0"
        type: string
  push:
    branches:
      - main
      - delete-all-nsb-from-baseline-39418922471
    paths:
      - ".github/workflows/build-apk-only.yml"
      - "combined_refactor/index.html"
      - "combined_refactor/protocol.go"
      - "combined_refactor/server.go"
      - "combined_refactor/tasks_speed.go"
      - "combined_refactor/tasks_official.go"
      - "combined_refactor/tasks_common.go"
      - "combined_refactor/session.go"
      - "combined_refactor/types.go"
      - "combined_refactor/cli.go"
      - "combined_refactor/utils.go"
      - "combined_refactor/menu.go"
      - "combined_refactor/main.go"

permissions:
  contents: read

jobs:
  android-apk:
    name: Android APK (debug-signed, no repository keystore)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.4"
          cache-dependency-path: combined_refactor/go.sum

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Set Version
        id: set-version
        run: |
          version="${{ github.event.inputs.version }}"
          if [ -z "$version" ]; then
            version="debug-${GITHUB_SHA::7}"
          fi
          echo "VERSION=$version" >> $GITHUB_OUTPUT

      - name: Download CA Certificates
        run: |
          curl -fsSL --retry 3 --connect-timeout 10 \
            https://curl.se/ca/cacert.pem \
            -o combined_refactor/ca-certificates.crt

      - name: Build Android backend
        working-directory: combined_refactor
        env:
          GOOS: android
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: |
          go build -ldflags "-s -w -X main.appVersion=${{ steps.set-version.outputs.VERSION }}" -o ../app/src/main/jniLibs/arm64-v8a/libcfdata.so .

      - name: Check embedded JavaScript syntax
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class ScriptExtractor(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_script = False
                  self.parts = []
                  self.current = []
              def handle_starttag(self, tag, attrs):
                  if tag == "script":
                      self.in_script = True
                      self.current = []
              def handle_data(self, data):
                  if self.in_script:
                      self.current.append(data)
              def handle_endtag(self, tag):
                  if tag == "script" and self.in_script:
                      self.parts.append("".join(self.current))
                      self.in_script = False
          parser = ScriptExtractor()
          parser.feed(Path("combined_refactor/index.html").read_text(encoding="utf-8"))
          Path("/tmp/cfdata-inline.js").write_text("\n".join(parser.parts), encoding="utf-8")
          PY
          node --check /tmp/cfdata-inline.js

      - name: Build debug APK (uses Android debug signing, no repository secrets)
        env:
          ANDROID_VERSION_NAME: ${{ steps.set-version.outputs.VERSION }}
        run: gradle assembleDebug --no-daemon

      - name: Verify APK Contains Backend
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | tee apk-contents.txt
          grep -q "lib/arm64-v8a/libcfdata.so" apk-contents.txt
          unzip -l app/build/outputs/apk/debug/app-debug.apk "lib/arm64-v8a/libcfdata.so"

      - name: Prepare APK Asset
        run: |
          mkdir -p release_assets
          cp app/build/outputs/apk/debug/app-debug.apk release_assets/cfdata-android-arm64-debug.apk
          cd release_assets
          sha256sum cfdata-android-arm64-debug.apk | awk '{print $1}' > cfdata-android-arm64-debug.apk.sha256

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: asset-android-arm64-apk-debug
          path: release_assets/*
