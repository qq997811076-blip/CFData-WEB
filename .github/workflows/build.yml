name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Debug APK version label"
        required: false
        default: "v1.0"
        type: string
  push:
    branches:
      - "main"
      - "beta-gxg-file-url-20261015"
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.4"
          cache-dependency-path: combined_refactor/go.sum

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Set Version
        id: set-version
        run: |
          version="${{ github.event.inputs.version }}"
          if [ -z "$version" ]; then
            version="v1.0"
          fi
          echo "VERSION=$version" >> $GITHUB_OUTPUT

      - name: Download CA Certificates
        run: |
          curl -fsSL --retry 3 --connect-timeout 10 \
            https://curl.se/ca/cacert.pem \
            -o combined_refactor/ca-certificates.crt

      - name: Build Android backend
        working-directory: combined_refactor
        env:
          GOOS: android
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: |
          go build -ldflags "-s -w -X main.appVersion=${{ steps.set-version.outputs.VERSION }}" -o ../app/src/main/jniLibs/arm64-v8a/libcfdata.so .

      - name: Build Debug APK
        env:
          ANDROID_VERSION_NAME: ${{ steps.set-version.outputs.VERSION }}
        run: gradle assembleDebug --no-daemon

      - name: Verify APK Contains Backend
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | tee apk-contents.txt
          grep -q "lib/arm64-v8a/libcfdata.so" apk-contents.txt

      - name: Prepare APK Artifact
        run: |
          mkdir -p release_assets
          build_time=$(TZ=Asia/Shanghai date +'%Y%m%d-%H%M%S')
          cp app/build/outputs/apk/debug/app-debug.apk "release_assets/${build_time}.apk"
          cd release_assets
          sha256sum *.apk | awk '{print $1}' > SHA256SUMS.txt

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cfdata-debug-apk
          path: release_assets/*
          if-no-files-found: error
          retention-days: 14
