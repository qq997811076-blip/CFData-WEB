name: Build and Release

on:
  push:
    branches:
      - main
      - fix/speed-timeouts-6s-from-41970526128
    paths:
      - "combined_refactor/**"
      - "app/**"
      - ".github/workflows/build.yml"
      - "build.gradle"
      - "settings.gradle"
      - "gradle/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Build version"
        required: false
        default: "v1.0"
        type: string

permissions:
  contents: read

concurrency:
  group: cfdata-web-apk-build
  cancel-in-progress: false

jobs:
  android-apk:
    name: Android ARM64 APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: combined_refactor/go.mod
          cache: true
          cache-dependency-path: combined_refactor/go.sum
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"
      - name: Set Version
        id: set-version
        run: |
          version="${{ github.event.inputs.version }}"
          if [ -z "$version" ]; then version="v1.0"; fi
          echo "VERSION=$version" >> "$GITHUB_OUTPUT"
      - name: Download CA Certificates
        run: |
          curl -fsSL --retry 3 --connect-timeout 10 https://curl.se/ca/cacert.pem -o combined_refactor/ca-certificates.crt
      - name: Build Android backend
        working-directory: combined_refactor
        env:
          GOOS: android
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: |
          mkdir -p ../app/src/main/jniLibs/arm64-v8a
          go build -trimpath -ldflags "-s -w -X main.appVersion=${{ steps.set-version.outputs.VERSION }}" -o ../app/src/main/jniLibs/arm64-v8a/libcfdata.so .
          test -s ../app/src/main/jniLibs/arm64-v8a/libcfdata.so
      - name: Build APK
        env:
          ANDROID_VERSION_NAME: ${{ steps.set-version.outputs.VERSION }}
        run: gradle assembleUnsigned --no-daemon
      - name: Sign and Verify Installable APK
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for the APK actually produced by Gradle..."
          mapfile -t apk_candidates < <(find app/build/outputs -type f -name '*.apk' -print 2>/dev/null | sort)
          if [ "${#apk_candidates[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one APK, found ${#apk_candidates[@]}."
            echo "APK output files:"
            find app/build/outputs -type f -print 2>/dev/null || true
            exit 1
          fi

          apk_file="${apk_candidates[0]}"
          if [ ! -s "$apk_file" ]; then
            echo "::error::Gradle APK output is empty: $apk_file"
            exit 1
          fi
          echo "Unsigned APK: $apk_file ($(stat -c%s "$apk_file") bytes)"

          if ! unzip -Z1 "$apk_file" | grep -Eq '^lib/arm64-v8a/libcfdata\.so$'; then
            echo "::error::ARM64 backend missing; listing APK entries for diagnosis:"
            unzip -Z1 "$apk_file"
            exit 1
          fi

          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$apksigner" ] || [ ! -x "$apksigner" ]; then
            echo "::error::apksigner was not found in Android SDK build-tools."
            exit 1
          fi

          # Generate a temporary Android debug key locally on the runner.
          # No user-provided JKS, repository secret, or Release signing is used.
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/cfdata-debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

          signed_apk="$RUNNER_TEMP/cfdata-android-arm64-signed.apk"
          "$apksigner" sign \
            --ks "$RUNNER_TEMP/cfdata-debug.keystore" \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --out "$signed_apk" \
            "$apk_file"

          "$apksigner" verify --verbose --print-certs "$signed_apk"
          test -s "$signed_apk"
          echo "Signed APK: $signed_apk ($(stat -c%s "$signed_apk") bytes)"
          echo "APK_PATH=$signed_apk" >> "$GITHUB_ENV"
      - name: Prepare APK Artifact
        run: |
          set -euo pipefail
          mkdir -p release_assets
          cp "$APK_PATH" release_assets/cfdata-android-arm64.apk
          cd release_assets
          sha256sum cfdata-android-arm64.apk | awk '{print $1}' > cfdata-android-arm64.apk.sha256
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: asset-android-arm64-apk
          path: release_assets/*
          if-no-files-found: error
