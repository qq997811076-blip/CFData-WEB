
name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Build version"
        required: false
        default: "v1.0"
        type: string

permissions:
  contents: read

jobs:
  android-apk:
    name: Android ARM64 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: combined_refactor/go.mod
          cache: true
          cache-dependency-path: combined_refactor/go.sum

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"

      - name: Set Version
        id: set-version
        run: |
          version="${{ github.event.inputs.version }}"
          if [ -z "$version" ]; then
            version="v1.0"
          fi
          echo "VERSION=$version" >> $GITHUB_OUTPUT

      - name: Download CA Certificates
        run: |
          curl -fsSL --retry 3 --connect-timeout 10 \
            https://curl.se/ca/cacert.pem \
            -o combined_refactor/ca-certificates.crt

      - name: Build Android backend
        working-directory: combined_refactor
        env:
          GOOS: android
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: |
          go build -trimpath \
            -ldflags "-s -w -X main.appVersion=${{ steps.set-version.outputs.VERSION }}" \
            -o ../app/src/main/jniLibs/arm64-v8a/libcfdata.so .

      - name: Build APK
        env:
          ANDROID_VERSION_NAME: ${{ steps.set-version.outputs.VERSION }}
        run: |
          gradle assembleRelease --no-daemon

      - name: Verify APK Contains Backend
        run: |
          unzip -l app/build/outputs/apk/release/app-release.apk | tee apk-contents.txt
          grep -q "lib/arm64-v8a/libcfdata.so" apk-contents.txt

      - name: Prepare APK Artifact
        run: |
          mkdir -p release_assets
          cp app/build/outputs/apk/release/app-release.apk \
            release_assets/cfdata-android-arm64.apk

          cd release_assets
          sha256sum cfdata-android-arm64.apk \
            | awk '{print $1}' > cfdata-android-arm64.apk.sha256

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: asset-android-arm64-apk
          path: release_assets/*
          if-no-files-found: error
